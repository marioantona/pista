<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- ── Background — rounded-square tile ─────────────────────── -->
  <g id="background">
    <rect x="12" y="12" width="488" height="488" rx="88" fill="#6750A4"/>
  </g>

  <!-- ── Runway ──────────────────────────────────────────────────── -->
  <g id="runway">
    <!-- Solid edge line — thicker -->
    <line x1="30" y1="374" x2="482" y2="374"
          stroke="#EADDFF" stroke-width="10"/>
    <!-- Centerline dashes — dimmer, positioned BELOW the solid edge line -->
    <rect x="58"  y="384" width="40" height="9" rx="2.5" fill="#EADDFF" opacity="0.38"/>
    <rect x="148" y="384" width="40" height="9" rx="2.5" fill="#EADDFF" opacity="0.38"/>
    <rect x="238" y="384" width="40" height="9" rx="2.5" fill="#EADDFF" opacity="0.38"/>
    <rect x="328" y="384" width="40" height="9" rx="2.5" fill="#EADDFF" opacity="0.38"/>
    <rect x="418" y="384" width="40" height="9" rx="2.5" fill="#EADDFF" opacity="0.38"/>
  </g>

  <!-- ── Constellation — scaled 0.85× around centre (331,112), shifted up 15px ── -->
  <!-- New nodes: A(247,72) B(334,58) C(408,85) D(376,141) E(289,128)             -->
  <!-- D bottom = 141+14 = 155; plane tail fin at y≈185 → 30px clear gap          -->
  <g id="constellation">

    <!-- Dim background mesh -->
    <line x1="247" y1="72"  x2="334" y2="58"  stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <line x1="334" y1="58"  x2="408" y2="85"  stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <line x1="408" y1="85"  x2="376" y2="141" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <line x1="376" y1="141" x2="289" y2="128" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <line x1="289" y1="128" x2="247" y2="72"  stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <line x1="334" y1="58"  x2="376" y2="141" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

    <!-- Highlighted route A → B → D -->
    <line x1="247" y1="72"  x2="334" y2="58"
          stroke="#EADDFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="334" y1="58"  x2="376" y2="141"
          stroke="#EADDFF" stroke-width="5" stroke-linecap="round"/>

    <!-- Arrowhead sits on the line just above node D's circumference.
         Tip = D − unit×r = (376−6.3, 141−12.5) = (370,128) — on node boundary
         back = tip − unit×14 = (364,116)
         L = back − perp×9 = (356,120)   R = back + perp×9 = (372,112) -->
    <polygon points="370,128 356,120 372,112" fill="#EADDFF"/>

    <!-- Nodes (radii scaled 0.85×) -->
    <circle cx="247" cy="72"  r="12" fill="#EADDFF"/>
    <circle cx="334" cy="58"  r="15" fill="#EADDFF"/>
    <circle cx="408" cy="85"  r="10" fill="#EADDFF"/>
    <circle cx="376" cy="141" r="14" fill="#EADDFF"/>
    <circle cx="289" cy="128" r="9"  fill="#EADDFF"/>

  </g>

  <!-- ── Plane — two-tone: white body + semi-transparent secondary details ── -->
  <g id="plane" transform="translate(256, 278) rotate(-15) scale(1.3) translate(-256, -310)">

    <!-- PRIMARY (#FFFFFF) — main airframe structure -->
    <g fill="#FFFFFF">
      <!-- Horizontal stabiliser -->
      <polygon points="128,313 176,307 171,328 124,332"/>
      <!-- Far (upper) wing -->
      <polygon points="200,278 256,268 316,330 288,337"/>
      <!-- Main near wing -->
      <polygon points="186,316 256,300 334,374 298,385"/>
      <!-- Engine pylons — thin struts from wing to nacelles -->
      <rect x="212" y="314" width="9" height="12" rx="2"/>
      <rect x="264" y="314" width="9" height="14" rx="2"/>
      <!-- Vertical tail fin -->
      <polygon points="116,265 166,265 158,210 120,240"/>
      <!-- Fuselage -->
      <path d="M 116,290
               C 116,268 150,264 192,264
               L 356,264
               C 380,264 408,276 408,290
               C 408,304 380,316 356,316
               L 192,316
               C 150,316 116,312 116,290 Z"/>
    </g>

    <!-- SECONDARY (rgba(255,255,255,0.55)) — engines, window stripe, cockpit, winglet -->
    <!-- On the purple tile these render as warm lavender, creating depth against white body -->
    <g fill="rgba(255,255,255,0.55)">
      <!-- Engine nacelle 2 — inner -->
      <rect x="184" y="317" width="62" height="20" rx="10"/>
      <!-- Engine nacelle 1 — outer -->
      <rect x="232" y="319" width="94" height="26" rx="13"/>
      <!-- Winglet cap -->
      <polygon points="334,374 310,366 298,385"/>

    </g>

  </g>

</svg>
