<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -7 473 162">

  <g id="icon">

    <!-- ── Runway ─────────────────────────────────────────────────── -->
    <!-- Solid edge line — thicker -->
    <line x1="8" y1="129" x2="172" y2="129" stroke="#EADDFF" stroke-width="5"/>
    <!-- Centerline dashes — muted gray, positioned BELOW the solid edge line -->
    <rect x="22"  y="135" width="20" height="5" rx="1.5" fill="#79747E"/>
    <rect x="72"  y="135" width="20" height="5" rx="1.5" fill="#79747E"/>
    <rect x="122" y="135" width="20" height="5" rx="1.5" fill="#79747E"/>

    <!-- ── Plane — two-tone: purple body + pale lavender details ── -->
    <g id="plane" transform="rotate(-15, 90, 90)">
    
      <!-- SECONDARY (#EADDFF) — engine -->
      <g fill="#EADDFF">
        <!-- Engine nacelle 1 — outer -->
        <rect x="116" y="103" width="32" height="10" rx="5"/>
      </g>

      <!-- PRIMARY (#6750A4) — main airframe structure -->
      <g fill="#6750A4">
        <!-- Horizontal stabiliser -->
        <polygon points="30,97 54,93 51,105 27,108"/>
        <!-- Far (upper) wing -->
        <polygon points="100,83 120,80 148,106 132,109"/>
        <!-- Main near wing -->
        <polygon points="98,100 122,94 158,128 138,134"/>
        <!-- Engine pylons -->
        <rect x="108" y="100" width="4" height="6" rx="1.5"/>
        <rect x="126" y="101" width="4" height="7" rx="1.5"/>
        <!-- Vertical tail fin -->
        <polygon points="27,79 52,79 46,61 30,71"/>
        <!-- Fuselage -->
        <path d="M 27,90
                 C 27,82 40,79 54,79
                 L 145,79
                 C 157,79 168,84 168,90
                 C 168,96 157,101 145,101
                 L 54,101
                 C 40,101 27,98 27,90 Z"/>
      </g>

      <!-- SECONDARY (#EADDFF) — engine, winglet -->
      <g fill="#EADDFF">
        <!-- Engine nacelle 2 — inner -->
        <rect x="96"  y="101" width="22" height="7" rx="3.5"/>
        <!-- Winglet cap -->
        <polygon points="158,128 138,134 143,114"/>
      </g>

    </g>

    <!-- ── Constellation (same topology as iter-3, repositioned above plane) ── -->
    <!-- Nodes pushed into clear sky: A(94,20) B(133,13) C(166,26) D(152,51) E(113,45) -->
    <!-- Plane highest point after rotation is ~y=63, giving clear separation -->

    <!-- Dim mesh lines -->
    <g stroke="#49454F" stroke-width="1" fill="none">
      <line x1="94"  y1="20" x2="133" y2="13"/>
      <line x1="133" y1="13" x2="166" y2="26"/>
      <line x1="166" y1="26" x2="152" y2="51"/>
      <line x1="152" y1="51" x2="113" y2="45"/>
      <line x1="113" y1="45" x2="94"  y2="20"/>
      <line x1="133" y1="13" x2="152" y2="51"/>
    </g>

    <!-- Highlighted route A → B → D -->
    <line x1="94"  y1="20" x2="133" y2="13"
          stroke="#EADDFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="13" x2="152" y2="51"
          stroke="#EADDFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Arrowhead at D(152,51), dir B(133,13)→D(152,51)
         dx=19 dy=38 len≈42.5  unit=(0.447,0.894)  perp=(0.894,−0.447)
         back=(147.5,42.1)  L=(143,44)  R=(152,40) -->
    <polygon points="152,51 143,44 152,40" fill="#EADDFF"/>

    <!-- Nodes -->
    <circle cx="94"  cy="20" r="3" fill="#EADDFF"/>
    <circle cx="133" cy="13" r="5" fill="#EADDFF"/>
    <circle cx="166" cy="26" r="3" fill="#EADDFF"/>
    <circle cx="152" cy="51" r="4" fill="#EADDFF"/>
    <circle cx="113" cy="45" r="3" fill="#EADDFF"/>

  </g>

  <g id="wordmark">

    <!-- PISTA — white, heavy weight -->
    <text
      x="192" y="103"
      font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="80"
      font-weight="900"
      fill="#FFFFFF"
    >PISTA</text>

    <!-- Purple accent dot — natural gap after end of PISTA wordmark -->
    <circle cx="445" cy="96" r="6" fill="#6750A4"/>

  </g>

</svg>
