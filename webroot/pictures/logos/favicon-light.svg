<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- ── Background — rounded-square tile, white with subtle border ── -->
  <g id="background">
    <rect x="12" y="12" width="488" height="488" rx="88"
          fill="#FFFFFF" stroke="#E7E0EB" stroke-width="3"/>
  </g>

  <!-- ── Runway ──────────────────────────────────────────────────── -->
  <g id="runway">
    <line x1="30" y1="374" x2="482" y2="374"
          stroke="#6750A4" stroke-width="10"/>
    <rect x="58"  y="384" width="40" height="9" rx="2.5" fill="#CAC4D0"/>
    <rect x="148" y="384" width="40" height="9" rx="2.5" fill="#CAC4D0"/>
    <rect x="238" y="384" width="40" height="9" rx="2.5" fill="#CAC4D0"/>
    <rect x="328" y="384" width="40" height="9" rx="2.5" fill="#CAC4D0"/>
    <rect x="418" y="384" width="40" height="9" rx="2.5" fill="#CAC4D0"/>
  </g>

  <!-- ── Constellation ── -->
  <!-- Nodes: A(247,72) B(334,58) C(408,85) D(376,141) E(289,128) -->
  <g id="constellation">

    <line x1="247" y1="72"  x2="334" y2="58"  stroke="#E7E0EB" stroke-width="2"/>
    <line x1="334" y1="58"  x2="408" y2="85"  stroke="#E7E0EB" stroke-width="2"/>
    <line x1="408" y1="85"  x2="376" y2="141" stroke="#E7E0EB" stroke-width="2"/>
    <line x1="376" y1="141" x2="289" y2="128" stroke="#E7E0EB" stroke-width="2"/>
    <line x1="289" y1="128" x2="247" y2="72"  stroke="#E7E0EB" stroke-width="2"/>
    <line x1="334" y1="58"  x2="376" y2="141" stroke="#E7E0EB" stroke-width="2"/>

    <line x1="247" y1="72"  x2="334" y2="58"
          stroke="#6750A4" stroke-width="5" stroke-linecap="round"/>
    <line x1="334" y1="58"  x2="376" y2="141"
          stroke="#6750A4" stroke-width="5" stroke-linecap="round"/>

    <!-- Arrowhead on line above node D boundary (same position as dark variant) -->
    <polygon points="370,128 356,120 372,112" fill="#6750A4"/>

    <circle cx="247" cy="72"  r="12" fill="#6750A4"/>
    <circle cx="334" cy="58"  r="15" fill="#6750A4"/>
    <circle cx="408" cy="85"  r="10" fill="#6750A4"/>
    <circle cx="376" cy="141" r="14" fill="#6750A4"/>
    <circle cx="289" cy="128" r="9"  fill="#6750A4"/>

  </g>

  <!-- ── Plane — two-tone: purple body + medium-light purple details ── -->
  <g id="plane" transform="translate(256, 278) rotate(-15) scale(1.3) translate(-256, -310)">

    <!-- PRIMARY (#6750A4) — main airframe structure -->
    <g fill="#6750A4">
      <polygon points="128,313 176,307 171,328 124,332"/>
      <polygon points="200,278 256,268 316,330 288,337"/>
      <polygon points="186,316 256,300 334,374 298,385"/>
      <rect x="212" y="314" width="9" height="12" rx="2"/>
      <rect x="264" y="314" width="9" height="14" rx="2"/>
      <polygon points="116,265 166,265 158,210 120,240"/>
      <path d="M 116,290
               C 116,268 150,264 192,264
               L 356,264
               C 380,264 408,276 408,290
               C 408,304 380,316 356,316
               L 192,316
               C 150,316 116,312 116,290 Z"/>
    </g>

    <!-- SECONDARY (rgba(103,80,164,0.45)) — engines + winglet -->
    <g fill="rgba(103,80,164,0.45)">
      <rect x="184" y="317" width="62" height="20" rx="10"/>
      <rect x="232" y="319" width="94" height="26" rx="13"/>
      <polygon points="334,374 310,366 298,385"/>
    </g>

  </g>

</svg>
