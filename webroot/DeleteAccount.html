<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PISTA – Delete Account</title>
    <link rel="icon" type="image/svg+xml" id="pista-favicon" href="pictures/logos/favicon-light.svg" />

    <!-- Fonts & Material You -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>

    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <script src="theme.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Roboto, sans-serif;
            overflow: hidden;
            background: black;
        }

        .back-button {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
        }

        .back-button md-filled-tonal-button {
            height: 45px;
            --md-filled-tonal-button-container-color: #244788;
            --md-filled-tonal-button-label-text-color: #ffffff;
            border-radius: 25px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }

        .earth-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: url("./pictures/earth.jpg") center / cover no-repeat;
        }

        .auth-card {
            z-index: 2;
            background: rgba(20, 16, 30, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            color: white;
        }

        .logo p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form md-filled-text-field {
            width: 100%;
        }

        .form-actions md-filled-button {
            width: 100%;
            height: 52px;
        }

        .message {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .error-message {
            color: #FF5449;
            background: rgba(255,84,73,0.12);
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .error-message.visible {
            display: block;
        }

        .success-message {
            color: #4CAF50;
            background: rgba(76,175,80,0.12);
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .success-message.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="earth-bg"></div>

    <div class="back-button">
        <md-filled-tonal-button onclick="history.back()">
            <md-icon slot="icon">arrow_back</md-icon>
            Back
        </md-filled-tonal-button>
    </div>

    <div class="container">
        <div class="auth-card">

            <div class="logo">
                <img data-pista-logo="simplified-h" src="pictures/logos/simplified-h-light.svg" alt="PISTA" style="height: 48px; width: auto; max-width: 280px; object-fit: contain; margin-bottom: 8px;" />
            </div>

            <form class="form" method="POST" action="delete_account.php" id="delete-form">

                <div class="message" id="delete-intro">
                    Enter your password in order to delete your account
                </div>

                <p class="error-message" id="error-msg"></p>
                <p class="success-message" id="success-msg"></p>

                <div id="password-block">
                    <md-filled-text-field
                        id="password"
                        name="password"
                        label="Password"
                        type="password">
                        <md-icon slot="leading-icon">lock</md-icon>
                    </md-filled-text-field>
                </div>

                <!-- Accounts created through Google or Microsoft have no password,
                     so they confirm by signing in again instead (Phase 0C). -->
                <div id="oauth-block" style="display: none;">
                    <md-filled-tonal-button type="button" id="reauth-btn">
                        <md-icon slot="icon">verified_user</md-icon>
                        Confirm with your provider
                    </md-filled-tonal-button>
                </div>

                <div class="form-actions" id="submit-block">
                    <md-filled-button type="submit">
                        Delete Account
                    </md-filled-button>
                </div>
            </form>

        </div>
    </div>
    
    <script>
        // Which proof this account can give, and what the server just told us.
        // The page posts natively, so failures arrive as ?error=<code> rather
        // than in a response body (Phase 0C).
        (function () {
            const params = new URLSearchParams(window.location.search);
            const errorEl = document.getElementById("error-msg");
            const intro = document.getElementById("delete-intro");
            const passwordBlock = document.getElementById("password-block");
            const oauthBlock = document.getElementById("oauth-block");
            const submitBlock = document.getElementById("submit-block");
            const reauthBtn = document.getElementById("reauth-btn");

            const messages = {
                password: "That password is not correct. Please try again.",
                reauth: "Please confirm with your provider before deleting your account."
            };

            const problem = params.get("error");
            if (problem) {
                errorEl.textContent = messages[problem] || "Your account could not be deleted.";
                errorEl.classList.add("visible");
            }

            const confirmed = params.get("reauth") === "1";

            fetch("get_profile.php")
                .then(res => res.json())
                .then(data => {
                    if (!data.success) return;
                    const method = data.data.auth_method;
                    if (method !== "oauth" && method !== "both") return;

                    if (method === "oauth") {
                        // No password exists on this account: asking for one could
                        // only ever fail, which is exactly the bug this replaces.
                        passwordBlock.style.display = "none";
                        document.getElementById("password").removeAttribute("name");
                    }

                    const provider = data.data.oauth_provider || "";
                    const label = provider === "microsoft" ? "Microsoft" : provider === "google" ? "Google" : "your provider";

                    if (confirmed) {
                        intro.textContent = "Identity confirmed. Deleting your account cannot be undone.";
                        submitBlock.style.display = "";
                        oauthBlock.style.display = "none";
                        if (method === "both") passwordBlock.style.display = "none";
                    } else {
                        intro.textContent = method === "both"
                            ? "Enter your password, or confirm with " + label + ", to delete your account."
                            : "Confirm with " + label + " to delete your account.";
                        reauthBtn.textContent = "Confirm with " + label;
                        oauthBlock.style.display = "";
                        // A hybrid account keeps the password field as well: either proof works.
                        submitBlock.style.display = method === "both" ? "" : "none";
                        reauthBtn.addEventListener("click", () => {
                            window.location.href = "oauth_handler.php?provider=" + encodeURIComponent(provider) + "&purpose=delete";
                        });
                    }
                })
                .catch(() => { /* leave the password form as the default */ });
        })();
    </script>
</body>
</html>
