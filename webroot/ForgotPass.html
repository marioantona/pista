<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PISTA – Reset Password</title>
    <link rel="icon" type="image/svg+xml" id="pista-favicon" href="pictures/logos/favicon-light.svg" />

    <!-- Fonts & Material You -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>

    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <script src="theme.js?v=20260921c"></script>

    <link rel="stylesheet" href="auth.css?v=20260921c">
    <script src="i18n.js?v=20260921c" defer></script>
</head>

<body>
    <div class="earth-bg"></div>

    <div class="back-button">
        <md-filled-tonal-button onclick="history.back()" data-i18n="nav-back">
            <md-icon slot="icon">arrow_back</md-icon>
            Back
        </md-filled-tonal-button>
    </div>

    <div class="container">
        <div class="auth-card">

            <div class="logo">
                <img src="pictures/logos/simplified-h-dark.svg" alt="PISTA" style="height: 48px; width: auto; max-width: 280px; object-fit: contain; margin-bottom: 8px;" />
            </div>

            <form class="form" method="POST" action="forgot_password.php">

                <div class="message" data-i18n="reset-msg">
                    Enter your email
                </div>

                <p class="error-message" id="error-msg"></p>
                <p class="success-message" id="success-msg"></p>

                <md-filled-text-field
                    id="email"
                    name="email"
                    label="Email"
                    type="email"
                    required
                    data-i18n="email-label">
                    <md-icon slot="leading-icon">lock</md-icon>
                </md-filled-text-field>


                <div class="form-actions">
                    <md-filled-button type="submit" data-i18n="btn-next">
                        Next
                    </md-filled-button>
                </div>
            </form>

        </div>
    </div>

    <script>
    document.querySelector(".form").addEventListener("submit", async (e) => {
        e.preventDefault() // Stop the traditional form submission

        const form = e.target
        const formData = new FormData(form)
        const submitBtn = form.querySelector("md-filled-button")
        const errorMsg = document.getElementById("error-msg")
        const successMsg = document.getElementById("success-msg")

        //Reset UI state
        submitBtn.disabled = true
        errorMsg.classList.remove("visible")
        successMsg.classList.remove("visible")

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            })

            const data = await response.json()

            if (data.success) {
                successMsg.textContent = data.message
                successMsg.classList.add("visible")
                form.reset() // Clear the email field
            } else {
                errorMsg.textContent = data.message
                errorMsg.classList.add("visible")
            }
        } catch (error) {
            console.error("Error:", error)
            errorMsg.textContent = "A network error occured. Please try again."
            errorMsg.classList.add("visible")
        } finally {
            submitBtn.disabled = false
        }
    })
    </script>
  
</body>
</html>
