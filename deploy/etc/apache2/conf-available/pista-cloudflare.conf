# Cloudflare is the only supported path to this origin: ingress on 80/443 is
# restricted to the ranges below at both the OCI security list and iptables
# (see docs/RUNBOOK.md §3). This file makes Apache agree with that topology.
#
# mod_remoteip replaces REMOTE_ADDR with the value of CF-Connecting-IP, but ONLY
# for requests whose real peer is one of the RemoteIPTrustedProxy ranges. A
# request from anywhere else keeps its true peer address no matter what headers
# it sends -- which is the entire security property. Before this existed, the
# header was plain client input and forging it minted a fresh guest quota
# identity on every request.
#
# Consequences worth knowing:
#   - %h in the access log becomes the real visitor, not 172.7x.x.x. No vhost
#     change needed; the PISTA vhosts inherit vhost_combined.
#   - webroot/client_ip.php returns REMOTE_ADDR and nothing else. PHP must never
#     read HTTP_CF_CONNECTING_IP directly again -- that would skip this check.
#
# The list is Cloudflare's published IPv4 set (https://www.cloudflare.com/ips-v4).
# It changes occasionally and a stale list fails CLOSED, locking out real
# visitors. ~/pista-scripts/cf-range-check.sh reports drift monthly; it never
# edits anything. IPv6 is deliberately absent: this host has no global IPv6
# address and Apache listens on IPv4 only (verified 16 September 2026).
#
# NOTE: cloudflare.com/ips-v4 serves its LAST LINE WITHOUT A TRAILING NEWLINE.
# `wc -l` undercounts by one and a bare `while read` silently drops 131.0.72.0/22.
# Parse with awk 'NF' or grep. Getting this wrong fails closed, for real visitors.
RemoteIPHeader CF-Connecting-IP

RemoteIPTrustedProxy 173.245.48.0/20
RemoteIPTrustedProxy 103.21.244.0/22
RemoteIPTrustedProxy 103.22.200.0/22
RemoteIPTrustedProxy 103.31.4.0/22
RemoteIPTrustedProxy 141.101.64.0/18
RemoteIPTrustedProxy 108.162.192.0/18
RemoteIPTrustedProxy 190.93.240.0/20
RemoteIPTrustedProxy 188.114.96.0/20
RemoteIPTrustedProxy 197.234.240.0/22
RemoteIPTrustedProxy 198.41.128.0/17
RemoteIPTrustedProxy 162.158.0.0/15
RemoteIPTrustedProxy 104.16.0.0/13
RemoteIPTrustedProxy 104.24.0.0/14
RemoteIPTrustedProxy 172.64.0.0/13
RemoteIPTrustedProxy 131.0.72.0/22
