# Composer's vendor tree discloses exact library versions to CVE scanners
<Directory /var/www/html/vendor>
    Require all denied
</Directory>

# Dependency manifests, docs, schema dumps, logs, stray env files
<FilesMatch "^(composer\.(json|lock)|README\.md|schema\.sql|.*\.log)$">
    Require all denied
</FilesMatch>

# Any dotfile (.env, .git, .gitignore ...)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Stop advertising the exact Apache/OS build
ServerTokens Prod
ServerSignature Off

# Phase 0B item 6. The only legitimate caller of the Node price-verification
# endpoint is verify_itinerary.php, which reaches it over localhost:3000 and
# never passes through this Apache. Publicly it is pure attack surface: every
# request fans out into one SerpAPI call per leg. Node also refuses it without a
# 'verify' X-PISTA-Token; this denies it before it reaches Node at all.
# The authz check runs before the /api reverse proxy hands the request on.
#
# LocationMatch with (?i), NOT <Location>. <Location> is case-sensitive but
# Express routes are case-INsensitive by default, so /api/VERIFY-ITINERARY
# slipped past a plain <Location> and reached the Node handler -- found by
# probing, not by reading. /+ also covers repeated slashes. Prefix match, so a
# trailing slash or a longer path is denied too.
<LocationMatch "(?i)^/api/+verify-itinerary">
    Require all denied
</LocationMatch>
