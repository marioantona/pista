<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pistaflights.com
    ServerAlias www.pistaflights.com
    DocumentRoot /var/www/html

    # Reverse Proxy for the Node.js API
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
    
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/pistaflights.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/pistaflights.com/privkey.pem
</VirtualHost>
</IfModule>
